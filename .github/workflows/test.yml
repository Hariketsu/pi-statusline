name: test

# Whitelist, not a blacklist: everything not listed here (prose docs, publishing and
# development notes, the preview image, LICENSE) skips CI. Two docs are listed because
# tests/docs.test.ts parses them — they are part of the test surface, not just prose.
#
# GitHub does not support YAML anchors in workflows, so the list appears twice.
on:
  push:
    branches: [main]
    paths:
      - "index.ts"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/**"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/configuration.md"
      - "docs/internals.md"
  pull_request:
    paths:
      - "index.ts"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/**"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/configuration.md"
      - "docs/internals.md"

# Superseded runs on the same ref are pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the documented floor (engines.node); 24 is what most people run.
        node: ["22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: node --version

      # No dependencies to install: the tests use node's own runner and type stripping,
      # and the git tests create their own throwaway repositories.
      - run: node --test tests/*.test.ts
